      // LOGICAL OPERATORS:

      //  AND (&&) OPERATOR
      //  OR (||) OPERATOR
      //  NOT (!) OPERATOR
      
      // Truthy and falsy value
      // Falsy values are:
      // NaN, 0, '', false, undefined, null
      // And all values that does not call is a truthy value

      // Shortcut for If-Statements
      // Ternary Operator ? :
      // Guard Operator &&
      // Default Operator ||

      // TERNARY OPERATOR
      const result = true ? "truthy" : "falsy";
      console.log(result);

      // GUARD OPERATOR
      const message = false && "Hello";
      console.log(message);

      // DEFAULT OPERATOR
      const currency = "" || "USD";
      console.log(currency);

     

  </script>
