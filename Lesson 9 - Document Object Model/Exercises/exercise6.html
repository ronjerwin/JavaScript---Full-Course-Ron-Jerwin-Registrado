<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
</head>
<body>
  <p>
    <button onclick="
      console.log(updateCalculation('1'));
    ">1</button>
    <button onclick="
     console.log(updateCalculation('2'));
    ">2</button>
    <button onclick="
     console.log(updateCalculation('3'));
    ">3</button>
    <button onclick="
     console.log(updateCalculation(' + '));
    ">+</button>
  </p>

  <p>
    <button onclick="
     console.log(updateCalculation('4'));
    ">4</button>
    <button onclick="
     console.log(updateCalculation('5'));
    ">5</button>
    <button onclick="
     console.log(updateCalculation('6'));
    ">6</button>
    <button onclick="
     console.log(updateCalculation(' - '));
    ">-</button>
  </p>

  <p>
    <button onclick="
     console.log(updateCalculation('7'));
    ">7</button>
    <button onclick="
     console.log(updateCalculation('8'));
    ">8</button>
    <button onclick="
     console.log(updateCalculation('9'));
    ">9</button>
    <button onclick="
     console.log(updateCalculation(' * '));
    ">*</button>
  </p>

  <p>
    <button onclick="
     console.log(updateCalculation('0'));
    ">0</button>
    <button onclick="
     console.log(updateCalculation('.'));
    ">.</button>
    <button onclick="
     console.log(updateCalculation('='));
    ">=</button>
    <button onclick="
     console.log(updateCalculation(' / '));
    ">/</button>
  </p>

  <button onclick="
    calculation = '';
    localStorage.removeItem('calculation');
    calculationResult.textContent = '';
  ">Clear</button>


  <p id="calculationResult"></p>

  <script>

    const calculationResult = document.querySelector('#calculationResult');

    let calculation = localStorage.getItem('calculation') || "";
    calculationResult.textContent = calculation;
    function updateCalculation(value) {
     if (value === '=') {
      const result = eval(calculation);
      calculationResult.textContent = result;
      calculation = "";
      localStorage.removeItem('calculation');
      return;
    }

    calculation += value;
    localStorage.setItem('calculation', calculation);
    calculationResult.textContent = calculation;
    }
  </script>
</body>
</html>
