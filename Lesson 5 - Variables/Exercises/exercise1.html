<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lesson 5 Execises - Variable</title>
</head>
<body>
  

  <script>
    const name = "Ron Jerwin";
    console.log(`My name is ${name}`);

    const coffee = 5;
    const bagel = 3;
    const soup = 9;
    const cost = coffee + (bagel * 2) + soup;
    console.log(`Cost of food: $${cost}`);

    const taxedCost = cost * 0.1; 
    console.log(`Tax (10%): $${taxedCost}`);

    const totalCost = cost + taxedCost;
    console.log(`Total Cost: $${totalCost}`);
  </script>
</body>
</html>
