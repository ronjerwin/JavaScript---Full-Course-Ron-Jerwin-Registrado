<!DOCTYPE html>
<html lang="en">
<head>
  <title>HTML, CSS, JS Together</title>
  <style>
    /* Internal CSS STYLING */
    .subscribe-btn {
      background-color: black;
      color: white;
      font-weight: bold;
      border-radius: 50px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
    }

    #costOfOrder {
      padding: 10px 15px;
      font-size: 15px;
    }


    .calcBtn {
      background-color: green;
      padding: 12px 15px;
      color: white;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    .is-subscribed {
      background-color: gray;
    }
  </style>
</head>
<body>
  <p>YouTube Subscribe Button</p>
  <button id="subs-btn" class="subscribe-btn">Subscribe</button>
  <br><br><br>

  <p>Rock Paper Scissors</p>
  <a href="Exercise2/exercise2.html">Click here</a>
  <br><br><br>

  <p>Amazon Shipping Calculator</p>
  <p>Order under $40 = +$10 shipping.</p>
  <p>Order over $40 = FREE shipping.</p>
    <input id="costOfOrder" type="text" placeholder="Cost of order">
    <button class="calcBtn" onclick="handleCalculation()">Calculate</button>
    <p id="result"></p>



  <script>
    
    const subscribeBtn = document.querySelector('#subs-btn');

    subscribeBtn.addEventListener('click', function() {
      if(subscribeBtn.textContent === 'Subscribe') {
        subscribeBtn.textContent = 'Subscribed!';
        // classList is used to add or remove a class in a specific element
        subscribeBtn.classList.add('is-subscribed');
      } else {
        subscribeBtn.textContent = 'Subscribe';
        subscribeBtn.classList.remove('is-subscribed');
      }
    })

  const costOfOrder = document.querySelector('#costOfOrder');

    function handleCalculation() {
      const result = document.querySelector('#result');

      if(isNaN(costOfOrder.value)) {
        result.textContent = 'Please Input Number';
        return;
      }

          
      if(costOfOrder.value < 40) {
        result.textContent = `$${Number(costOfOrder.value) + 10}`;
      } else {
        result.textContent = `$${costOfOrder.value}`;
      }

    }


     costOfOrder.addEventListener('keydown', function(event) {
      // event.key === 'Enter' && handleCalculation();
        if(event.key === 'Enter') {
          handleCalculation();
        }
      });

  
    

   
     

   

  </script>
</body>
</html>
