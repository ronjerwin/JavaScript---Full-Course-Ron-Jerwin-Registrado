<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lesson 7 - Exercise - Functions</title>
</head>
<body>
  


  <script>
    function greet(name) {
    
      if(!name) {
        console.log("Hi there!")
      } else {
        console.log(`Hello! ${name}`);
      }
    }
    greet("Ron Jerwin");
    greet("RJ");
    greet();


    function convertToFahrenheit(celsius) {
      const fahrenheit = (celsius * 9 / 5) + 32;
      console.log(fahrenheit);
    }
    convertToFahrenheit(25);

    function convertToCelsius(fahrenheit) {
      const celsius = (fahrenheit - 32) * 5 / 9;
      console.log(celsius);
    }
    convertToCelsius(86);

    function convertTemperature(degrees, unit) {
      if(unit === 'C') {
       degrees = (degrees * 9 / 5) + 32;
       return `${degrees}F`;
      } else if(unit === 'F') {
        degrees = (degrees - 32) * 5 / 9;
        return `${degrees}C`;
      }
    }
    console.log(convertTemperature(25, 'C'));
    console.log(convertTemperature(86, 'F'));



    function convertLength(length, from, to) {


      if(from !== 'km' && from !== 'miles' && from !== 'feet') {
        return `Invalid unit: ${from}`;
      } 
      
      if(to !== 'km' && to !== 'miles' && to !== 'feet') {
        return `Invalid unit: ${to}`;
      }
      
      if(from === 'km' && to === 'miles') {
          length = length / 1.6;
          return `${length} miles`;
      } else if(from === 'miles' && to === 'km') {
          length = length * 1.6;
          return `${length} km`;
      } else if(from === 'km' && to === 'feet') {
          length = length * 3281;
          return `${length} feet`;
      } else if(from === 'miles' && to === 'feet') {
          length = length * 5280;
          return `${length} ft`;
      } else if(from === 'feet' && to === 'km') {
          length = length / 3281;
          return `${length} km`;
      } else if(from === 'feet' && to === 'miles') {
          length = length / 5280;
          return `${length} miles`;
      } else if(from === to){
          return `${length}${to}`;
      } 
    }
    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(50, 'km', 'km'));
    console.log(convertLength(5, 'km', 'feet'));
    console.log(convertLength(5, 'miles', 'feet'));
    console.log(convertLength(5, 'lbs', 'feet'));
  </script>
</body>
</html>
