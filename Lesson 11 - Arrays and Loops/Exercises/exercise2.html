    function countPositive(nums) {
      let result = 0;
      for(let i = 0; i < nums.length; i++) {
        if(nums[i] > 0) {
          result += 1;
        }
      }
      return result;
    }
    console.log(countPositive([1, -3, 5]));

    // 11l.
    function minMax(nums) {

      const result = {
        min: nums[0],
        max: nums[0]
      }
      // 11m.
      if(!nums.length) {
        result.min = null;
        result.max = null;
      }
      for(let i = 0; i < nums.length; i++) {
        const num = nums[i];

        if(num < result.min) {
          result.min = num;
        } else if(num > result.min) {
          result.max = num;
        } 
      }
      return result;
    }
