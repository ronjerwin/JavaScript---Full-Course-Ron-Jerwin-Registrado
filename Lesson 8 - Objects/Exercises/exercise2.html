  <script>
  // Step 1: Create the basketball product object and display it
  const basketball = {
    name: 'basketball',
    price: 2095
  };
  console.log(basketball);

  // Step 2: Increase the price by 500 cents using dot notation
  basketball.price += 500;
  console.log(basketball);

  // Step 3: Add 'delivery-time' using bracket notation
  basketball['delivery-time'] = '3 days';
  console.log(basketball);

  // Step 4: Function to compare two product objects
  function comparePrice(product1, product2) {
    if (product1.price < product2.price) {
      return product1; // Returns the whole object
    } else {
      return product2;
    }
  }

  // Create 2 products to test the function
  const item1 = { name: 'Upo', price: 50 };
  const item2 = { name: 'Saging', price: 60 };

  // Try out the function and log the result
  console.log(comparePrice(item1, item2));
